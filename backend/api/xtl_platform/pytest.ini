# XTL platform test suite configuration (committed; no shell PYTHONPATH).
#
# pytest resolves its config by walking UP from the test path, so running
#   python3 -m pytest api/xtl_platform/tests
# from the repository root selects THIS file, deterministically, regardless
# of any repository-root pytest.ini / pyproject.toml.
#
# rootdir = api/xtl_platform, so conftest.py files above it (repo root, api/)
# are never loaded: the platform suite cannot pull in app, Redis or MT5 code.
#
# pythonpath = ../..  puts the repository root on sys.path, relative to this
# file, so the single canonical import name is `api.xtl_platform`.
[pytest]
testpaths = tests
pythonpath = ../..
addopts = --import-mode=importlib -p no:cacheprovider
consider_namespace_packages = true
